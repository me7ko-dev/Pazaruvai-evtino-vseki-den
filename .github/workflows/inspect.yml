name: Преглед на данните

# Сваля последния ден от kolkostruva.bg и показва в лога какво има:
# вериги, брой обекти, развалени редове и какви продукти има във всяка група (1–101).
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Населени места
        run: node scripts/fetch-ekatte.mjs
      - name: Отчет
        run: node scripts/build-data.mjs --no-geocode --report
