name: Цени и сайт

on:
  schedule:
    - cron: '17 10 * * *' # всеки ден в 13:17 българско лятно време (търговците качват до 12:00)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Населени места (само първия път)
        run: node scripts/fetch-ekatte.mjs

      - name: Сваляне и подреждане на цените
        run: node scripts/build-data.mjs --max-geocode 2500

      - name: Запазване на намерените адреси
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          # Междувременно main може да се е променил (друго пускане, нов код):
          # сливаме кеша с адресите вместо да презаписваме.
          git fetch -q origin main
          git show origin/main:data/geocache.json > /tmp/remote-geo.json 2>/dev/null || echo '{}' > /tmp/remote-geo.json
          node scripts/merge-geocache.mjs /tmp/remote-geo.json data/geocache.json
          git reset -q origin/main
          git add data/geocache.json data/ekatte.json 2>/dev/null || git add data/geocache.json
          git diff --cached --quiet || (git commit -q -m "Нови адреси на магазини [skip ci]" && git push -q origin HEAD:main)

      # Сайтът се публикува в клона gh-pages (GitHub Pages го включва сам, без настройки).
      # Всеки път е един нов commit, за да не расте репото от дневните цени.
      - name: Публикуване в gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Цени от $(jq -r .date data/meta.json)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # Опит да се включи GitHub Pages от клона gh-pages, ако още не е включен.
      # Ако GitHub не разреши: Settings → Pages → Branch: gh-pages → Save.
      - name: Включване на GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 && { echo "Pages вече е включен"; exit 0; }
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/"
