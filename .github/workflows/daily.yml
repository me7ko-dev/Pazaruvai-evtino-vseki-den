name: Цени и сайт

on:
  schedule:
    - cron: '17 10 * * *' # всеки ден в 13:17 българско лятно време (търговците качват до 12:00)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Населени места (само първия път)
        run: node scripts/fetch-ekatte.mjs

      - name: Сваляне и подреждане на цените
        run: node scripts/build-data.mjs --max-geocode 2500

      - name: Запазване на намерените адреси
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || (git commit -m "Нови адреси на магазини [skip ci]" && git pull --rebase -q && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
